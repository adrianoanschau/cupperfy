<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:32px 16px;background:#111;color:#f5f5f5;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;margin:0 auto;background:#1a1a1a;border-radius:16px;padding:32px;">
      <tr>
        <td>
          <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#f97316;font-weight:700;">Cupperfy</p>
          <h1 style="margin:0 0 16px;font-size:24px;color:#fff;">Crie sua senha</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5;color:#d4d4d4;">
            Clique no botão abaixo para confirmar este e-mail e definir a senha da sua conta.
          </p>
          <p style="margin:0 0 24px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#f97316;color:#111;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:10px;">
              Criar minha senha
            </a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#a3a3a3;">
            Se você não pediu este e-mail, pode ignorar.
          </p>
        </td>
      </tr>
    </table>
  </body>
